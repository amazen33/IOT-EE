# LoadBalancer Services on the private Hyper-V cluster:
#  - kube-vip-cloud-provider assigns each Service an address from the pool in
#    kubevip-address-pool.yaml;
#  - the kube-vip DaemonSet (services-only mode) announces it on the VM network.
# Pinned to the v0.0.12 cloud-provider release manifest (checked 2026-09-25),
# never "main".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kube-vip-cloud-controller.yaml
  - kube-vip-rbac.yaml
  - kube-vip-daemonset.yaml
  - kubevip-address-pool.yaml
