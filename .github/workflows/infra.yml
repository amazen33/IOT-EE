name: "Infrastructure gate: deploy/"
on:
  push:
    paths: ["deploy/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["deploy/**", ".github/workflows/infra.yml"]
permissions:
  contents: read
# Static checks only. Nothing here can reach the Hyper-V hosts or change
# infrastructure: `tofu apply` and the Ansible playbooks are run by a human
# (development contract: no infrastructure action without explicit approval).
jobs:
  layer0:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          # Plain tofu binary: the wrapper rewrites stdout and exit codes,
          # which the Layer 0 tests read.
          tofu_wrapper: false
      - name: Verify standalone Layer 0 (the directory's one test command)
        shell: pwsh
        run: ./deploy/00-infra/private-hyperv/tests/verify.ps1 -RunTofu

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/01-k8s-engine/rke2-ansible
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core
      - name: Syntax-check every playbook against the committed inventory
        env:
          RKE2_TOKEN: syntax-check-only-not-a-real-token-0000000000
        run: |
          for pb in site-rke2.yml health.yml heal.yml; do
            ansible-playbook --syntax-check -i inventory/hosts.ini "$pb"
          done
      - name: Only ansible.builtin modules (no unpinned collections)
        run: |
          bad=$(grep -rhoE '^\s+-? ?[a-z_]+\.[a-z_]+\.[a-z_]+:' site-rke2.yml health.yml heal.yml roles | grep -v 'ansible\.builtin\.' || true)
          if [ -n "$bad" ]; then echo "Non-builtin modules: $bad"; exit 1; fi

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate the add-on manifests
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -
