[defaults]
inventory = inventory/generated/hosts.yml
roles_path = roles
host_key_checking = True
# Fresh VMs have unknown host keys: run `ssh-keyscan` for each node into
# ~/.ssh/known_hosts once after provisioning (see deploy/README.md) rather
# than disabling host-key checking.
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 10

[ssh_connection]
pipelining = True
