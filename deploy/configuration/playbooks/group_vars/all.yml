---
# Loaded for every play in playbooks/ (group_vars next to the playbooks is
# picked up regardless of which inventory file is used).
# ----- RKE2 ----------------------------------------------------------------
# Pinned, never "latest". v1.35.7+rke2r1 was RKE2's *stable* channel on
# 2026-09-25 (rancher/rke2 release notes). Upgrade deliberately, one minor at
# a time, servers before agents.
rke2_version: "v1.35.7+rke2r1"

# Cluster join secret. Read from the environment so it never lands in Git:
#   export RKE2_TOKEN="$(openssl rand -hex 32)"   # once; store it in your vault
# Losing it means new nodes cannot join and etcd snapshots cannot be restored.
rke2_token: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"

# Control-plane virtual IP held by kube-vip. Must be a free address in the
# node subnet, outside the DHCP range, and not in kube_vip_lb_range.
rke2_api_vip: "192.168.1.20"
# Optional DNS name for the API; added to the API server certificate.
rke2_api_fqdn: ""

rke2_node_ip: "{{ ansible_host }}"

# ----- kube-vip --------------------------------------------------------------
# v1.2.4 checked against kube-vip's GitHub releases (2026-09-25).
kube_vip_version: "v1.2.4"
# Interface the VIP is announced on (cloud-init names the NIC eth0).
kube_vip_interface: "eth0"

# ----- Outputs ---------------------------------------------------------------
# Admin kubeconfig fetched after bootstrap (git-ignored).
kubeconfig_output_dir: "{{ playbook_dir }}/../.kube"
