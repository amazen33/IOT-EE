[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = True
# Fresh VMs have unknown host keys: ssh-keyscan each node into
# ~/.ssh/known_hosts once after provisioning (README.md, step 2) instead of
# disabling host-key checking.
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 10

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
