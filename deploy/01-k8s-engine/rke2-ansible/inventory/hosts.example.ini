# EXAMPLE inventory -- committed; the real one is not.
#
# Shape of the Layer 1 inventory: 1 RKE2 server + 2 RKE2 agents. Addresses
# are from 192.0.2.0/24 (RFC 5737, reserved for documentation) so this file
# can never point at a real machine; validate-inventory.yml rejects them for
# a live run.
#
# The REAL inventory is inventory/hosts.ini, which is git-ignored. Generate it
# from Layer 0's output (preferred; nothing typed by hand):
#   tofu -chdir=deploy/00-infra/private-hyperv output -raw ansible_inventory_ini > deploy/01-k8s-engine/rke2-ansible/inventory/hosts.ini
# or copy this file to inventory/hosts.ini and edit it. Either way, run
#   ansible-playbook -i inventory/hosts.ini validate-inventory.yml
# before site-rke2.yml (site-rke2.yml also runs the same checks first).
#
# Node addresses and groups live ONLY in the inventory (here, or the
# generated file) and in inventory/host_vars/ -- never in ansible.cfg and
# never as -e extra vars. Group names use underscores (Ansible rejects "-" in
# group names); the node roles are rke2-server (control plane + etcd) and
# rke2-agent (workers). No secrets: the cluster token comes from $RKE2_TOKEN.

[rke2_server]
rke2-master-01 ansible_host=192.0.2.10

[rke2_agent]
rke2-worker-01 ansible_host=192.0.2.21
rke2-worker-02 ansible_host=192.0.2.22

[rke2_cluster:children]
rke2_server
rke2_agent

[rke2_cluster:vars]
ansible_user=iotee
ansible_python_interpreter=/usr/bin/python3
