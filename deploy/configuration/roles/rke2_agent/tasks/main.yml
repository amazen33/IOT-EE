---
- name: Install RKE2 agent binaries
  ansible.builtin.include_role:
    name: rke2_install
  vars:
    rke2_install_type: agent

- name: RKE2 agent configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Restart rke2-agent

- name: Start RKE2 agent
  ansible.builtin.systemd_service:
    name: rke2-agent
    enabled: true
    state: started

- name: Apply pending config changes before waiting for readiness
  ansible.builtin.meta: flush_handlers

- name: Wait for this node to report Ready (checked from the first server)
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    get node {{ inventory_hostname }}
    -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ groups['rke2_servers'][0] }}"
  register: rke2_ready
  until: rke2_ready.stdout == "True"
  retries: 60
  delay: 10
  changed_when: false
