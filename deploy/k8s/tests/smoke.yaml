---
apiVersion: v1
kind: Namespace
metadata:
  name: layer2-smoke
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer2-echo
  namespace: layer2-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer2-echo
  template:
    metadata:
      labels:
        app: layer2-echo
    spec:
      containers:
        - name: echo
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p /tmp/www && echo layer2-ok > /tmp/www/index.html &&
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: scratch
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: scratch
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: layer2-echo
  namespace: layer2-smoke
spec:
  type: LoadBalancer
  selector:
    app: layer2-echo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
