# Layer 1 inventory: 1 RKE2 server + 2 RKE2 agents.
#
# Addresses and the SSH user match Layer 0's defaults
# (deploy/00-infra/private-hyperv, network 10.20.0.0/24). If you changed
# Layer 0's nodes or network, regenerate this file from its output instead:
#   tofu -chdir=deploy/00-infra/private-hyperv output -raw ansible_inventory_ini > deploy/01-k8s-engine/rke2-ansible/inventory/hosts.ini
#
# Group names use underscores (Ansible rejects "-" in group names); the node
# roles are rke2-server (control plane + etcd) and rke2-agent (workers).
# No secrets in this file: the cluster token comes from $RKE2_TOKEN.

[rke2_server]
rke2-master-01 ansible_host=10.20.0.10

[rke2_agent]
rke2-worker-01 ansible_host=10.20.0.21
rke2-worker-02 ansible_host=10.20.0.22

[rke2_cluster:children]
rke2_server
rke2_agent

[rke2_cluster:vars]
ansible_user=iotee
ansible_python_interpreter=/usr/bin/python3
