# Shape of the inventory Layer 0 emits (deploy/00-infra/private-hyperv,
# output "ansible_inventory"). Used by CI syntax checks, and for running
# Ansible against machines Layer 0 did not create:
#   ansible-playbook -i inventory/hosts.example.yml ...
all:
  vars:
    ansible_user: iotee
  children:
    rke2_servers:
      hosts:
        rke2-master-01: { ansible_host: 10.20.0.10 }
    rke2_agents:
      hosts:
        rke2-worker-01: { ansible_host: 10.20.0.21 }
        rke2-worker-02: { ansible_host: 10.20.0.22 }
