---
- name: Only Ubuntu 22.04+ is supported by this skeleton
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] is version('22.04', '>=')
    fail_msg: "Unsupported OS {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Wait for cloud-init to finish its first boot
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: [curl, ca-certificates, jq]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn swap off now (kubelet requirement)
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Keep swap off after reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Load kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Kernel networking settings for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-rke2.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"
  notify: Apply sysctl

- name: Keep time in sync (etcd and TLS depend on it)
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started
