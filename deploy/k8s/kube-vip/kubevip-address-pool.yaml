# LoadBalancer address pool (kube-vip-cloud-provider ConfigMap format).
# Must be free LAN addresses: outside the DHCP range, and not overlapping the
# nodes or the control-plane VIP (rke2_api_vip, 192.168.1.20 by default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-global: 192.168.1.40-192.168.1.49
