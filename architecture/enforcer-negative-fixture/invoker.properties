# Read by maven-invoker-plugin when this fixture is run via the root
# pom's opt-in "enforcerNegativeTest" profile (S3). The fixture's own
# pom.xml deliberately declares a banned com.iotee.platform:* dependency
# (see that file's header comment); this line asserts the resulting
# build must fail rather than succeed -- if the enforce-no-shared-runtime
# rule stops firing, invoker reports this fixture ITSELF as a failed
# verification, surfacing the regression the moment it happens instead
# of silently doing nothing (which is exactly the state S3 found: the
# rule had never been shown to fail a build at all).
invoker.buildResult=failure
invoker.goals=validate
