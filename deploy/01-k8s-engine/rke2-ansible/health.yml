---
# READ-ONLY node health check. Changes nothing, so it is safe to schedule
# (cron / CI) and alert on. Exit code is non-zero when any node is unhealthy
# (set health_fail_on_problem=false to always exit 0).
#   ansible-playbook health.yml

- name: Collect per-node health
  hosts: rke2_cluster
  become: true
  gather_facts: true
  vars:
    health_min_root_free_pct: 15
    health_min_mem_available_mb: 512
  tasks:
    - name: Service state
      ansible.builtin.service_facts:

    - name: Kubernetes Ready condition (asked from a server)
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        get node {{ inventory_hostname }}
        -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['rke2_server'] | difference([inventory_hostname]) | first | default(groups['rke2_server'][0]) }}"
      register: health_ready
      changed_when: false
      failed_when: false

    - name: Evaluate
      vars:
        unit: "{{ 'rke2-server.service' if inventory_hostname in groups['rke2_server'] else 'rke2-agent.service' }}"
        root: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"
        root_free_pct: "{{ (100 * root['size_available'] / root['size_total']) | round(1) }}"
        mem_available_mb: "{{ ansible_facts['memory_mb']['nocache']['free'] }}"
        unit_state: "{{ ansible_facts['services'][unit]['state'] | default('missing') }}"
        problems: >-
          {{ ([] if unit_state == 'running' else [unit ~ ' is ' ~ unit_state])
             + ([] if health_ready.stdout | default('') == 'True' else ['node not Ready (' ~ (health_ready.stdout | default('unknown') or 'unknown') ~ ')'])
             + ([] if root_free_pct | float >= health_min_root_free_pct else ['root filesystem ' ~ root_free_pct ~ '% free'])
             + ([] if mem_available_mb | int >= health_min_mem_available_mb else ['only ' ~ mem_available_mb ~ ' MB memory available']) }}
      ansible.builtin.set_fact:
        node_health:
          node: "{{ inventory_hostname }}"
          unit: "{{ unit }}"
          unit_state: "{{ unit_state }}"
          ready: "{{ health_ready.stdout | default('') == 'True' }}"
          root_free_pct: "{{ root_free_pct }}"
          mem_available_mb: "{{ mem_available_mb }}"
          problems: "{{ problems }}"
          healthy: "{{ problems | length == 0 }}"

- name: Report
  hosts: localhost
  gather_facts: false
  vars:
    health_fail_on_problem: true
    report_dir: "{{ playbook_dir }}/reports"
    all_nodes: "{{ groups['rke2_server'] + groups['rke2_agent'] }}"
    results: "{{ all_nodes | map('extract', hostvars, 'node_health') | select('defined') | list }}"
    unreachable: "{{ all_nodes | reject('in', results | map(attribute='node') | list) | list }}"
  tasks:
    # Asked through kubectl on the first server: the CIS profile turns off
    # anonymous access, so an unauthenticated GET /readyz would be refused.
    - name: API server readiness (kubectl get --raw /readyz on the first server)
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        get --raw /readyz
      delegate_to: "{{ groups['rke2_server'][0] }}"
      become: true
      register: health_api_raw
      changed_when: false
      ignore_errors: true

    - name: Record API readiness
      ansible.builtin.set_fact:
        health_api:
          status: "{{ 200 if (health_api_raw is succeeded and health_api_raw.stdout | trim == 'ok') else 0 }}"

    - name: Report directory (git-ignored)
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Write the JSON report
      ansible.builtin.copy:
        dest: "{{ report_dir }}/health-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}.json"
        content: "{{ {'api_ready': health_api.status | int == 200, 'unreachable': unreachable, 'nodes': results} | to_nice_json }}"
        mode: "0644"

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          API server: {{ 'ready' if health_api.status | int == 200 else 'NOT READY' }} |
          unhealthy: {{ results | rejectattr('healthy') | map(attribute='node') | list }} |
          unreachable: {{ unreachable }}

    - name: Fail when anything is unhealthy
      ansible.builtin.assert:
        that:
          - health_api.status | int == 200
          - results | rejectattr('healthy') | list | length == 0
          - unreachable | length == 0
        fail_msg: "Cluster unhealthy; see the report. Remediate with heal.yml."
      when: health_fail_on_problem | bool
