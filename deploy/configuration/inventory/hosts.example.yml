# Shape of the inventory Terraform generates into inventory/generated/hosts.yml.
# Only needed if you run Ansible against machines Terraform did not create:
#   ansible-playbook -i inventory/hosts.example.yml ...
all:
  vars:
    ansible_user: iotee
    cluster_name: iotee-pc
  children:
    rke2_servers:
      hosts:
        rke2-server-1: { ansible_host: 192.168.1.21, hyperv_host: optiplex }
        rke2-server-2: { ansible_host: 192.168.1.22, hyperv_host: optiplex }
        rke2-server-3: { ansible_host: 192.168.1.23, hyperv_host: optiplex }
    rke2_agents:
      hosts:
        rke2-agent-1: { ansible_host: 192.168.1.31, hyperv_host: laptop }
        rke2-agent-2: { ansible_host: 192.168.1.32, hyperv_host: laptop }
